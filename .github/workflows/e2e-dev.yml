name: Prueba de punta a punta (handimanya-flutter-dev)

# Corre la app (su capa de datos real) contra el proyecto Supabase de
# DESARROLLO: entra con tres cuentas temporales, postula y aprueba a un
# profesional, recarga la billetera, hace un pedido completo (aceptar, chat,
# avance, pago, reseña) y uno cancelado, y revisa la privacidad de la dirección.
# Al final borra todo lo que creó, aunque la prueba falle.
#
# Solo se activa al subir la rama supabase/e2e-dev. No aplica migraciones ni
# cambia la estructura de la base. No envía códigos por WhatsApp o SMS.
# Secretos: SUPABASE_DB_URL (ya existe) y SUPABASE_ANON_KEY (la clave pública
# "anon" o "publishable" del proyecto de desarrollo).

on:
  push:
    branches: [supabase/e2e-dev]

permissions:
  contents: read

concurrency:
  group: supabase-dev-db
  cancel-in-progress: false

jobs:
  e2e:
    name: Reserva real de punta a punta
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPECTED_REF: yldqopeldibwgbwmdnzy
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que es el proyecto nuevo
        run: supabase/scripts/check_target.sh

      - name: Revisar la clave pública
        run: |
          if [ -z "${ANON_KEY}" ]; then
            echo "::error::Falta el secreto SUPABASE_ANON_KEY (Supabase > Project Settings > API Keys, clave anon o publishable de handimanya-flutter-dev)."
            exit 1
          fi

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Contraseña temporal de las cuentas de prueba
        run: |
          pw="$(openssl rand -hex 24)"
          echo "::add-mask::${pw}"
          echo "E2E_PASSWORD=${pw}" >> "$GITHUB_ENV"

      - name: Borrar restos de una corrida anterior
        run: psql "${DB_URL}" -X -v ON_ERROR_STOP=1 -f supabase/e2e/cleanup.sql

      - name: Crear las cuentas temporales
        run: psql "${DB_URL}" -X -v ON_ERROR_STOP=1 -v pw="${E2E_PASSWORD}" -f supabase/e2e/setup.sql

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      - name: Prueba de punta a punta
        run: |
          flutter test test_e2e --reporter expanded \
            --dart-define=E2E_URL="https://${EXPECTED_REF}.supabase.co" \
            --dart-define=E2E_ANON_KEY="${ANON_KEY}" \
            --dart-define=E2E_PASSWORD="${E2E_PASSWORD}"

      - name: Borrar todo lo que creó la prueba
        if: always()
        run: psql "${DB_URL}" -X -v ON_ERROR_STOP=1 -f supabase/e2e/cleanup.sql

      - name: Confirmar que no quedaron datos de prueba
        if: always()
        run: |
          psql "${DB_URL}" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          select 'Cuentas E2E que quedaron: ' || count(*) from auth.users where email like 'e2e-%@test.bo';
          do $$ begin
            if exists (select 1 from auth.users where email like '%@test.bo') then
              raise exception 'HMY: quedaron cuentas de prueba en la base';
            end if;
          end $$;
          SQL
