name: Revisar Firebase (avisos, sin teléfono)

# Diagnóstico temporal de la clave de avisos. Hace lo mismo que el teléfono
# antes de pedir el token: crea una instalación de Firebase con la clave, el ID
# de app, el paquete y la huella SHA-1 del APK de prueba, y la borra. Muestra
# la forma de la clave (sin mostrarla), el motivo exacto que da Google y, si
# Google lo dice, a qué proyecto pertenece. Nunca imprime la clave ni tokens.
# Gratis (Firebase Installations no cobra); no cambia ni despliega nada.
#
# Para comparar con una clave nueva sin pegarla en el chat: guárdala en GitHub
# como secreto FIREBASE_API_KEY_NEW (Settings > Secrets and variables >
# Actions > New repository secret) y vuelve a correr esta revisión.

# Solo se activa al subir la rama firebase/check-dev.
on:
  push:
    branches: [firebase/check-dev]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La misma llave de depuración que el APK de prueba
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probar la configuración de Firebase
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_API_KEY_NEW: ${{ secrets.FIREBASE_API_KEY_NEW }}
        run: |
          set -o pipefail
          test -n "$FIREBASE_API_KEY" || { echo "::error::El secreto FIREBASE_API_KEY no existe o está vacío"; exit 1; }
          # Ocultar cada línea por si el secreto tiene saltos de línea.
          while IFS= read -r l; do [ -n "$l" ] && echo "::add-mask::$l"; done <<< "$FIREBASE_API_KEY"
          while IFS= read -r l; do [ -n "$l" ] && echo "::add-mask::$l"; done <<< "$FIREBASE_API_KEY_NEW"
          [ -n "$FIREBASE_API_KEY_NEW" ] && echo "FIREBASE_API_KEY_NEW existe: también se prueba." || echo "Sin FIREBASE_API_KEY_NEW: solo se prueba la guardada."
          ks="$HOME/.android/debug.keystore"
          set -a; . config/firebase-dev.public.env; set +a
          export ANDROID_PACKAGE=bo.handimanya.handimanya
          # El caché de la llave solo se lee desde feature/base-app; si no está, se usa
          # la huella pública que mostró la compilación 30 (la misma llave).
          if [ -f "$ks" ]; then
            ANDROID_CERT_SHA1=$(keytool -list -v -keystore "$ks" -storepass android | grep -m1 "SHA1:" | awk '{print $2}')
          else
            ANDROID_CERT_SHA1=0B:12:63:BF:DB:28:CC:12:93:BA:5E:6D:7B:EC:DD:E5:84:23:DD:0E
          fi
          export ANDROID_CERT_SHA1
          echo "SHA-1 del APK de prueba: $ANDROID_CERT_SHA1" | tee -a "$GITHUB_STEP_SUMMARY"
          node tool/firebase_probe.mjs | tee -a "$GITHUB_STEP_SUMMARY"
