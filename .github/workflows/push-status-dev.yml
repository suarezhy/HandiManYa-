name: Estado de avisos push (handimanya-flutter-dev)

# Solo lectura: muestra si los teléfonos quedaron registrados para avisos push
# y cómo va la cola de envíos en DESARROLLO, y comprueba que send-push rechaza
# a quien no tiene el secreto del webhook. Nunca imprime tokens. No cambia
# nada, no despliega nada y no envía avisos.
#
# Solo se activa al subir la rama supabase/push-status-dev.

on:
  push:
    branches: [supabase/push-status-dev]

permissions:
  contents: read

concurrency:
  group: supabase-dev-db
  cancel-in-progress: false

jobs:
  status:
    name: Teléfonos registrados y cola de avisos
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      EXPECTED_REF: yldqopeldibwgbwmdnzy
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que es el proyecto nuevo
        run: supabase/scripts/check_target.sh
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Estado (solo lectura)
        run: psql "${DB_URL}" -X -At -v ON_ERROR_STOP=1 -f supabase/e2e/push_status.sql | tee -a "$GITHUB_STEP_SUMMARY"
      - name: send-push no está abierto (sin secreto responde 401)
        run: bash tool/push_endpoint_check.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lo necesito ahora (solo lectura)
        run: psql "${DB_URL}" -X -At -v ON_ERROR_STOP=1 -f supabase/e2e/ya_status.sql | tee -a "$GITHUB_STEP_SUMMARY"
