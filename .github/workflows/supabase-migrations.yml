name: Base de datos Supabase (handimanya-flutter-dev)

# Nunca corre solo con el PR. Se activa únicamente:
# - al subir la rama supabase/revisar-dev  -> solo lee la base (no cambia nada);
# - al subir la rama supabase/aplicar-dev  -> aplica TODAS las migraciones en una
#   sola transacción (si algo falla, se deshace todo y la base queda como estaba);
# - o a mano desde Actions, cuando este archivo ya esté en main.
# La rama de aplicar solo se sube con la aprobación explícita del dueño del proyecto.
# La contraseña de la base va en el secreto SUPABASE_DB_URL; nunca en el código.

on:
  push:
    branches: [supabase/revisar-dev, supabase/aplicar-dev]
  workflow_dispatch:
    inputs:
      accion:
        description: 'revisar (solo lectura) o aplicar'
        required: true
        default: revisar
        type: choice
        options: [revisar, aplicar]
      confirmar:
        description: 'Para aplicar, escribe APLICAR'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: supabase-dev-db
  cancel-in-progress: false

jobs:
  db:
    name: ${{ (inputs.accion == 'aplicar' || github.ref_name == 'supabase/aplicar-dev') && 'Aplicar migraciones' || 'Revisar la base (solo lectura)' }}
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      EXPECTED_REF: yldqopeldibwgbwmdnzy
      APPLY: ${{ (inputs.accion == 'aplicar' && inputs.confirmar == 'APLICAR') || github.ref_name == 'supabase/aplicar-dev' }}
      WANTS_APPLY: ${{ inputs.accion == 'aplicar' || github.ref_name == 'supabase/aplicar-dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar que es el proyecto nuevo
        run: supabase/scripts/check_target.sh

      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Revisar la base (solo lectura)
        run: |
          set -euo pipefail
          psql "${DB_URL}" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          set default_transaction_read_only = on;
          select 'Sesión de solo lectura: ' || current_setting('default_transaction_read_only');
          select 'Base: ' || current_database() || ' · usuario: ' || current_user;
          select 'Versión: ' || version();
          select 'Tablas en public: ' || count(*) from information_schema.tables
            where table_schema = 'public' and table_type = 'BASE TABLE';
          select '  - ' || table_name from information_schema.tables
            where table_schema = 'public' and table_type = 'BASE TABLE' order by table_name;
          select 'Usuarios registrados: ' || count(*) from auth.users;
          select 'Buckets de archivos: ' || count(*) from storage.buckets;
          SQL

      - name: Aplicar migraciones (una sola transacción)
        if: env.WANTS_APPLY == 'true'
        run: |
          set -euo pipefail
          if [ "${APPLY}" != "true" ]; then
            echo "::error::Para aplicar, escribe APLICAR en el campo de confirmación."
            exit 1
          fi
          args=()
          for f in supabase/migrations/*.sql; do echo "Incluye: $f"; args+=(-f "$f"); done
          # -1: todo o nada. ON_ERROR_STOP: se detiene en el primer error.
          psql "${DB_URL}" -X -1 -v ON_ERROR_STOP=1 -q "${args[@]}"
          echo "Migraciones aplicadas."

      - name: Comprobar resultado
        if: env.APPLY == 'true'
        run: |
          psql "${DB_URL}" -X -At -v ON_ERROR_STOP=1 <<'SQL'
          select 'Tablas en public: ' || count(*) from information_schema.tables
            where table_schema = 'public' and table_type = 'BASE TABLE';
          select 'Tablas con RLS activo: ' || count(*) from pg_tables where schemaname = 'public' and rowsecurity;
          select 'Tablas SIN RLS: ' || coalesce(string_agg(tablename, ', '), 'ninguna') from pg_tables
            where schemaname = 'public' and not rowsecurity;
          select 'Categorías: ' || count(*) from public.service_categories;
          select 'Ciudades: ' || count(*) from public.cities;
          select 'Reglas de comisión: ' || count(*) || ' (empiezan vacías a propósito)' from public.commission_rules;
          SQL
