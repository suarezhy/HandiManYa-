<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/HandiManYa-/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="HandiMan ¡Ya!: servicios para el hogar y más en Bolivia.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HandiMan ¡Ya!">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HandiMan ¡Ya!</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#02173A">
  <style>
    html, body { margin: 0; height: 100%; background: #F7F8FA; }
    #hmy-loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 16px; font: 600 17px -apple-system, system-ui, sans-serif; color: #02173A; }
    #hmy-loading img { width: 96px; height: 96px; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="hmy-loading"><img src="icons/Icon-192.png" alt=""><span>Cargando HandiMan ¡Ya!…</span></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('hmy-loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
